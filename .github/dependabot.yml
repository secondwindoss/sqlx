version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: monthly
  ignore:
  # Test-only drivers. Every newer version raises the go directive above 1.10,
  # which the fork keeps; revisit when they move to a nested test module.
  - dependency-name: github.com/go-sql-driver/mysql
  - dependency-name: github.com/lib/pq
  - dependency-name: github.com/mattn/go-sqlite3
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
